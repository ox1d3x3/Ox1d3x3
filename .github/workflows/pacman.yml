# Save as: .github/workflows/pacman.yml
# In repo: Ox1d3x3/Ox1d3x3  (the special profile repo)

name: generate pacman contribution graph

on:
  schedule:
    # every 24 hours
    - cron: "0 18 * * *"   # 02:00 Perth time (AWST, UTC+8)
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # comma-separated. valid: pacman, bomberman, breakout, galaga,
          # puzzle-bobble, minesweeper. Keep it to pacman unless you want more.
          games: 'pacman'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
